name: Build Test
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: |
          xcodebuild -project Whisky.xcodeproj \
            -scheme Whisky \
            -configuration Debug \
            -destination 'platform=macOS' \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Find app
        id: find
        run: |
          app=$(xcodebuild -project Whisky.xcodeproj -scheme Whisky -configuration Debug \
            -showBuildSettings 2>/dev/null \
            | awk -F' = ' '
                /^ *BUILT_PRODUCTS_DIR = /  { dir = $2 }
                /^ *FULL_PRODUCT_NAME = /   { name = $2 }
                END { if (dir != "" && name != "") print dir "/" name }')
          echo "app_path=$app" >> $GITHUB_OUTPUT
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: BetterWhisky-Debug.app
          path: ${{ steps.find.outputs.app_path }}
